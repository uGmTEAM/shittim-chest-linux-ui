<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI OS - 什亭之匣</title>
    <link rel="stylesheet" href="css/style.css?v=21">
    <!-- Spine Player 运行时（本地文件，避免 CDN 网络问题） -->
    <script src="js/spine-player.js"></script>
    <script src="js/spine-bg.js"></script>
    <script src="js/spine-portrait.js"></script>
    <!-- 交互保护：全局拦截拖拽/放置/右键 -->
    <script>
        (function () {
            ['dragstart', 'dragend', 'drop', 'dragover'].forEach(function (ev) {
                document.addEventListener(ev, function (e) { e.preventDefault(); }, true);
            });
            document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
            document.addEventListener('selectstart', function (e) { e.preventDefault(); }, true);
            // _clear=1 时清除所有配置并刷新（服务端注入 localStorage.clear() 脚本）
            if (location.search.includes('_clear=1')) {
                localStorage.clear();
                location.search = '';
            }
        })();
    </script>
    <!-- 底部面板标准组件 -->
    <script src="js/bottom-panel.js"></script>
    <!-- 点击粒子特效 (ba-click-fx) -->
    <script type="module">
        import { BAClickFX } from './js/ba-click-fx.js';
        window.__baFx = new BAClickFX({
            scale: 0.5,
            clickEnabled: true,
            trailEnabled: true,
            opacity: 0.9,
            themeColor: '#4ca7ff',
            maxDpr: 1
        });
    </script>
</head>
<body>
    <!-- 页面转场白色遮罩（初始可见，加载完成后渐出） -->
    <div id="page-transition" style="position:fixed;inset:0;z-index:9999;background:#fff;opacity:1;pointer-events:auto;"></div>

    <!-- 对话输入层 -->
    <div id="input-overlay" class="input-overlay hidden">
        <div class="input-overlay-box">
            <div class="input-overlay-header">对我说点什么：</div>
            <div class="input-overlay-body">
                <input id="chat-input" type="text" placeholder="输入消息..." autocomplete="off" />
                <button id="chat-input-send" class="input-send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M5 12h14" />
                        <path d="M13 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 对话框层 -->
    <div id="dialog-box" class="dialog-box hidden">
        <div class="dialog-header">
            <span id="speaker-name" class="speaker-name">???</span>
        </div>
        <div id="dialog-text" class="dialog-text"></div>
        <div class="dialog-indicator">▼</div>
    </div>

    <!-- 交互按钮层 -->
    <div id="action-panel" class="action-panel hidden">
        <button class="action-btn" data-action="talk">对话</button>
        <button class="action-btn" data-action="config">设置</button>
        <button class="action-btn" data-action="exit">退出</button>
    </div>

    <!-- 设置面板 -->
    <div id="config-panel" class="config-panel hidden">
        <div class="config-header">
            <span>⚙ 设置</span>
            <button id="config-close" class="close-btn">×</button>
        </div>
        <div class="config-body">
            <div class="config-item">
                <label>角色</label>
                <select id="character-select">
                    <option value="arona">阿罗娜</option>
                    <option value="plana">普拉娜</option>
                </select>
            </div>
            <div class="config-item">
                <label>背景</label>
                <select id="background-select">
                    <option value="day">白天</option>
                    <option value="night">夜晚</option>
                </select>
            </div>
            <div class="config-item">
                <label>显示 FPS</label>
                <input type="checkbox" id="fps-toggle">
            </div>
            <div class="config-item">
                <label>AI 网关地址</label>
                <input type="text" id="gateway-url" placeholder="http://localhost:8080">
            </div>
            <div class="config-item">
                <label>面部表情</label>
                <select id="face-select">
                    <option value="">无</option>
                </select>
            </div>
        </div>
    </div>

    <!-- FPS 计数器 -->
    <div id="fps-counter" class="fps-counter hidden">FPS: --</div>

    <!-- 加载提示 -->
    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载桌面...</div>
    </div>

    <!-- 错误提示 -->
    <div id="error-box" class="error-box hidden">
        <div class="error-content">
            <h3>⚠ 加载失败</h3>
            <p id="error-message"></p>
            <button id="error-retry" class="retry-btn">重试</button>
        </div>
    </div>

    <!-- 主逻辑 -->
    <script src="js/app.js?v=21"></script>
    <script src="js/desktop.js?v=21"></script>
    <script src="js/bottom-panel.js?v=21"></script>
</body>
</html>
