set timeout=30
loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "AI OS 安装" {
    set gfxpayload=keep
    linux /casper/vmlinuz auto=true priority=critical locale=zh_CN --- quiet splash
    initrd /casper/initrd
}

menuentry "AI OS 专家安装" {
    set gfxpayload=keep
    linux /casper/vmlinuz nomodeset auto=true priority=critical locale=zh_CN --- quiet splash
    initrd /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
    menuentry 'Boot from next volume' --hidden {
        exit 1
    }
    menuentry 'UEFI Firmware Settings' --hidden {
        fwsetup
    }
else
    if [ -e /boot/memtest86+.bin ]; then
        menuentry 'Test memory' --hidden {
            linux16 /boot/memtest86+.bin
        }
    fi
fi
